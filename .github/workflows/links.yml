name: Link check
on:
    schedule:
        - cron: "0 6 * * 1" # Mondays 06:00 UTC
    workflow_dispatch:
permissions:
    contents: read
jobs:
    links:
        name: Check links in the built site
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            issues: write
        env:
            GH_TOKEN: ${{ github.token }}
            ISSUE_TITLE: Broken links report
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx astro build
            - name: Check links
              id: lychee
              uses: lycheeverse/lychee-action@v2
              with:
                  fail: false
                  args: >-
                      --no-progress
                      --max-concurrency 4
                      --accept '200..=299,429'
                      --root-dir ${{ github.workspace }}/dist
                      'dist/**/*.html'
            # Forks often have issues disabled; there the job summary holds the report instead
            - name: Check whether issues are enabled
              id: repo
              run: echo "issues=$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled --jq '.hasIssuesEnabled')" >> "$GITHUB_OUTPUT"
            - name: Fail without an issue to report to
              if: steps.repo.outputs.issues != 'true' && steps.lychee.outputs.exit_code != '0'
              run: |
                  echo "::error::Broken links found and issues are disabled on $GITHUB_REPOSITORY; see the job summary."
                  exit 1
            # One issue collects broken links: created or updated when links break, closed once fixed
            - name: Report broken links
              if: steps.repo.outputs.issues == 'true' && steps.lychee.outputs.exit_code != '0'
              run: |
                  number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')
                  if [ -n "$number" ]; then
                      gh issue edit "$number" --body-file lychee/out.md
                  else
                      gh issue create --title "$ISSUE_TITLE" --body-file lychee/out.md
                  fi
            - name: Close the report when links are fixed
              if: steps.repo.outputs.issues == 'true' && steps.lychee.outputs.exit_code == '0'
              run: |
                  number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number')
                  if [ -n "$number" ]; then
                      gh issue close "$number" --comment "All links pass as of $(date -u +%Y-%m-%d)."
                  fi
